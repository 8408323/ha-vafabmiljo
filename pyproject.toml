[project]
name = "ha-vafabmiljo"
version = "0.5.0"
requires-python = ">=3.13"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=3.0.0",
    "ruff>=0.17.5",
    "voluptuous>=0.13.1",
    # Dev only: Home Assistant ships its own aiohttp. aioresponses 0.7.9 doesn't pass the
    # stream_writer that aiohttp >= 3.10 requires; tests/test_api.py patches that in.
    "aiohttp>=3.14.5",
    "aioresponses>=0.7.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
