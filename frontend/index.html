<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VafabMiljö panel preview</title>
<style>body{margin:0;background:#111;--primary-background-color:#111;--card-background-color:#1c1c1c;--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--primary-color:#03a9f4;color-scheme:dark}</style>
</head><body><vafabmiljo-panel id="p"></vafabmiljo-panel>
<script type="module">
import "/src/main.tsx";
import mock from "/dev/mock.json";
// ?in=0 shifts the mock pickups so the first one is today (0), tomorrow (1), ...
const q = new URLSearchParams(location.search), shift = q.get("in");
if (shift != null) {
  const base = new Date(); base.setDate(base.getDate() + Number(shift));
  const first = Math.min(...Object.values(mock.states).filter((s) => s.attributes.device_class === "date").map((s) => Date.parse(s.state)));
  for (const s of Object.values(mock.states)) if (s.attributes.device_class === "date")
    s.state = new Date(base.getTime() + Date.parse(s.state) - first).toISOString().slice(0, 10);
}
const p = document.getElementById("p");
p.narrow = innerWidth < 600;
p.hass = { language: q.get("lang") || "sv", ...mock,
  callService: async (...a) => { console.log("callService", ...a); return { response: { path: "about:blank" } }; } };
</script></body></html>
